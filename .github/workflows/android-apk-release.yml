name: Android APK preview

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: false
        type: string
      version_code:
        description: Android version code
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}
      VERSION_CODE: ${{ inputs.version_code || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run Android unit tests and build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PandroidVersionName="${VERSION_NAME}" \
            -PandroidVersionCode="${VERSION_CODE}" \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Prepare release assets
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/android/photovance-android-${VERSION_NAME}.apk"
          sha256sum "dist/android/photovance-android-${VERSION_NAME}.apk" \
            > "dist/android/photovance-android-${VERSION_NAME}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: photovance-android-${{ env.VERSION_NAME }}
          path: |
            dist/android/photovance-android-${{ env.VERSION_NAME }}.apk
            dist/android/photovance-android-${{ env.VERSION_NAME }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: Photovance Android Preview v${{ env.VERSION_NAME }}
          prerelease: true
          make_latest: false
          body: |
            Installable Android preview APK built by GitHub Actions.

            This is a debug-signed preview, not a Play Store production release. Firebase project configuration and secure automatic Windows GPU pairing are not included yet. Sign-in, purchases, and image generation require the corresponding services to be configured.
          files: |
            dist/android/photovance-android-${{ env.VERSION_NAME }}.apk
            dist/android/photovance-android-${{ env.VERSION_NAME }}.apk.sha256
