name: Windows desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt -r requirements-windows-build.txt requests
      - name: Write build version
        shell: pwsh
        run: |
          @{ version = $env:APP_VERSION } | ConvertTo-Json | Set-Content desktop\build_info.json -Encoding utf8NoBOM
      - name: Build Windows desktop application
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name FaceStudio `
            --distpath (Join-Path $root "dist\windows") `
            --workpath (Join-Path $root "build\windows") `
            --specpath (Join-Path $root "build\windows") `
            --collect-all webview `
            --add-data "$root\desktop;desktop" `
            --add-data "$root\server.py;." `
            --add-data "$root\core;core" `
            --add-data "$root\static;static" `
            --add-data "$root\models;models" `
            --add-data "$root\extra_models.yaml;." `
            --add-data "$root\privacy.html;." `
            desktop_app.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$env:APP_VERSION" windows_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "dist\installer\FaceStudio-Setup.exe"
          $checksum = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  FaceStudio-Setup.exe" | Set-Content "$installer.sha256" -Encoding ascii -NoNewline
      - name: Run desktop persistence tests
        run: python -m unittest test_desktop_app -v
      - name: Publish update and installer release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.APP_VERSION }}
          name: Face Studio Windows v${{ env.APP_VERSION }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            dist/installer/FaceStudio-Setup.exe
            dist/installer/FaceStudio-Setup.exe.sha256
